[project]
name = "anlp-assignment-2"
version = "0.1.0"
description = "ANLP Assignment 2: Mixture of Experts, Pretraining Optimizers, and Decoding Strategies"
authors = [
    { name = "Student", email = "student@iiit.ac.in" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "tokenizers>=0.14.0",
    "einops>=0.7.0",
    "wandb>=0.16.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "evaluate>=0.4.0",
    "sacrebleu>=2.3.0",
    "rouge-score>=0.1.2",
    "reportlab>=4.0.0",
    "fpdf2>=2.7.0",
    "pytest>=7.4.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]
