# MoE Ablation 5: 4 experts, 2 active (Matched Active Parameters to Dense)
D_model: 256
N_ctx: 256
N_vocab: 16000
N_layers: 6
N_heads: 8
D_ff: 1024
dropout: 0.1
use_moe: true
ablation_variant: "matched_active"
num_experts: 4
num_active_experts: 2
