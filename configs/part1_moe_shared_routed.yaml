# MoE Ablation 4: 1 Shared Expert + 3 Routed Experts (1 active, total 2 active)
# Total params == Dense baseline
D_model: 256
N_ctx: 256
N_vocab: 16000
N_layers: 6
N_heads: 8
D_ff: 1024
dropout: 0.1
use_moe: true
ablation_variant: "shared_routed"
num_experts: 4
num_shared_experts: 1
num_active_experts: 1
aux_loss_coef: 0.01

learning_rate: 0.0003
weight_decay: 0.01
batch_size: 32
max_steps: 10000
